name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        id: check_credentials
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID secrets are not set"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - uses: actions/setup-node@v4
        if: steps.check_credentials.outputs.configured == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agentdecode/package-lock.json

      - run: npm ci --legacy-peer-deps
        if: steps.check_credentials.outputs.configured == 'true'
        working-directory: agentdecode

      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.check_credentials.outputs.configured == 'true'
        working-directory: agentdecode
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.check_credentials.outputs.configured == 'true'
        working-directory: agentdecode
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.check_credentials.outputs.configured == 'true'
        working-directory: agentdecode
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
